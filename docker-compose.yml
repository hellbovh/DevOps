version: '3.8'

services:
  backend:
    build: 
      context: ./../backend  # Добавляем точку в начале!
      dockerfile: Dockerfile
    container_name: backend
    volumes:
      - backend_data:/app/data
    ports:
      - "5000:5000"
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: ./../frontend  # Добавляем точку в начале!
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

volumes:
  backend_data:

networks:
  app-network:
    driver: bridge